apiVersion: v1
kind: Namespace
metadata:
  name: monstrare-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monstrare-data
  namespace: monstrare-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monstrare
  namespace: monstrare-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: monstrare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monstrare
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monstrare
          image: ghcr.io/chuannnn1/monstrare:edge
          imagePullPolicy: Always
          env:
            - name: KANBAN_HOST
              value: 0.0.0.0
            - name: KANBAN_PORT
              value: "4420"
            - name: KANBAN_DATA_DIR
              value: /data
            - name: KANBAN_CLAIM_TTL_SECONDS
              value: "900"
            - name: KANBAN_REQUIRE_READ_AUTH
              value: "true"
          envFrom:
            - secretRef:
                name: monstrare-secrets
          ports:
            - name: http
              containerPort: 4420
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: monstrare-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: monstrare
  namespace: monstrare-system
spec:
  selector:
    app.kubernetes.io/name: monstrare
  ports:
    - name: http
      port: 4420
      targetPort: http
