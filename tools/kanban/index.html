<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Monstrare</title>
<style>
  :root {
    --paper: #090b0e;
    --surface: #11151a;
    --surface-raised: #171c22;
    --surface-sunken: #0c1014;
    --ink: #e8edf3;
    --ink-dim: #b5bec8;
    --ink-faint: #7f8b99;
    --line: #232a32;
    --line-strong: #343d48;
    --accent: #42c7d5;
    --accent-soft: #102b30;
    --good: #45d29a;
    --good-soft: #102921;
    --warn: #e2aa43;
    --warn-soft: #302510;
    --crit: #f06870;
    --crit-soft: #32171b;
    --muted: #8994a1;
    --muted-soft: #20262d;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(66, 199, 213, 0.2);
    --shadow-modal: 0 28px 80px rgba(0, 0, 0, 0.62);
    --font-ui: "Segoe UI Variable Text", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    font-synthesis: none;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
  }
  .app-shell { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .workspace { min-width: 0; }

  h1, h2, h3 { text-wrap: balance; font-weight: 700; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(66, 199, 213, 0.28);
    border-radius: 6px;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  /* ── Top chrome ── */
  .sidebar { position: sticky; top: 0; height: 100vh; z-index: 30; display: flex; flex-direction: column; background: #0d1014; border-right: 1px solid var(--line); overflow: hidden; }
  .sidebar-brand { padding: 20px 16px 18px; border-bottom: 1px solid var(--line); }
  .brand-name { display: block; font-size: 16px; font-weight: 700; letter-spacing: 0; }
  .brand-sub { display: block; margin-top: 4px; font-size: 12px; color: var(--accent); letter-spacing: 0; }
  .sidebar-section-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 16px; }
  .sidebar-label { font-size: 12px; font-weight: 700; color: var(--ink-faint); letter-spacing: 0; }
  .project-nav { flex: 1; padding: 0 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .project-nav-item { width: 100%; min-height: 42px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink-dim); display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 9px; padding: 5px 8px; text-align: left; }
  .project-nav-item:hover { color: var(--ink); background: var(--surface-raised); }
  .project-nav-item.is-active { color: var(--ink); border-color: #28525a; background: var(--accent-soft); }
  .project-mark { width: 28px; height: 28px; border: 1px solid var(--line-strong); border-radius: 4px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent); background: var(--surface-sunken); }
  .project-nav-item.is-active .project-mark { border-color: var(--accent); box-shadow: 0 0 12px rgba(66, 199, 213, 0.18); }
  .project-nav-copy { min-width: 0; }
  .project-nav-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
  .project-nav-prefix { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .sidebar-footer { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
  .project-status { display: block; color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; margin-bottom: 9px; }
  .project-form { display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: 4px 8px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-sunken); }
  .project-form input, .auth-control input { width: 100%; height: 32px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); padding: 0 9px; }
  .project-form .prefix-input { text-transform: uppercase; }
  .toolbar-btn { height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0 12px; font-weight: 600; color: var(--ink-dim); }
  .toolbar-btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.primary { border-color: var(--accent); background: var(--accent); color: #071013; }
  .toolbar-btn.icon-btn { width: 30px; height: 30px; padding: 0; font-size: 20px; line-height: 1; }
  .project-form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .project-form[hidden], .auth-control[hidden] { display: none; }
  .auth-control { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(17, 21, 26, 0.96); border-bottom: 1px solid var(--line); }
  .topbar-row1 { min-height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; gap: 16px; }
  .active-context { min-width: 0; }
  .active-project-name { font-size: 16px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .active-project-meta { margin-top: 3px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }

  .view-tabs { display: flex; gap: 3px; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
  .view-tabs button { border: none; background: transparent; color: var(--ink-dim); font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 4px; transition: background-color .15s ease, color .15s ease; }
  .view-tabs button:hover { color: var(--ink); }
  .view-tabs button.is-active { background: var(--surface-raised); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ── pills ── */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .risk-low { background: var(--muted-soft); color: var(--muted); }
  .risk-medium { background: var(--warn-soft); color: var(--warn); }
  .risk-high { background: var(--crit-soft); color: var(--crit); }
  .agent-pill { background: var(--accent-soft); color: var(--accent); }
  .track-pill { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .dep-pill.dep-blocked { background: var(--crit-soft); color: var(--crit); }
  .dep-pill.dep-missing { background: var(--warn-soft); color: var(--warn); }
  .dep-pill.dep-ok { background: var(--surface-sunken); color: var(--ink-dim); font-weight: 600; }
  .approval-pill { background: var(--surface); color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .risk-stripe-low::before { background: var(--muted); }
  .risk-stripe-medium::before { background: var(--warn); }
  .risk-stripe-high::before { background: var(--crit); }

  /* ── card ── */
  .ticket-card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 15px 13px 17px; box-shadow: var(--shadow-card); cursor: grab;
    transition: box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .ticket-card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
  .ticket-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .ticket-card.is-dragging { opacity: 0.4; }
  .ticket-id { font-size: 11px; color: var(--ink-faint); font-weight: 600; letter-spacing: 0; }
  .ticket-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin: 4px 0 12px; }
  .ticket-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .ticket-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { .ticket-card, .modal, .modal-overlay { transition: none !important; } }

  /* ── lanes ── */
  .lanes { display: flex; gap: 10px; padding: 12px; background: var(--paper); overflow-x: auto; scroll-snap-type: x proximity; }
  .lane { flex: 0 0 282px; scroll-snap-align: start; background: #0c0f13; border: 1px solid var(--line); min-height: calc(100vh - 91px); display: flex; flex-direction: column; }
  .lane.is-drag-over { background: var(--accent-soft); }
  .lane-head { position: sticky; top: 0; padding: 14px 14px 12px; border-bottom: 1px solid var(--line); background: #0c0f13; z-index: 1; }
  .lane-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .lane-title { font-size: 14px; font-weight: 600; }
  .lane-gauge { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-dim); flex-shrink: 0; }
  .lane-gauge.is-over { background: var(--crit); color: #fff; }
  .lane-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .lane-empty { font-size: 12px; color: var(--ink-faint); padding: 12px 4px; }
  .lane-add-btn { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-faint); border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 600; text-align: center; }
  .lane-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .lane-add-form { display: flex; flex-direction: column; gap: 6px; }
  .lane-add-form input { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 8px; font-size: 13px; }
  .lane-add-form .row { display: flex; gap: 6px; }
  .lane-add-form button { border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .lane-add-form .save { background: var(--accent); color: #071013; flex: 1; }
  .lane-add-form .cancel { background: var(--surface-sunken); color: var(--ink-dim); }

  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.68); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; z-index: 100; opacity: 0; transition: opacity .15s ease; }
  .modal-overlay.is-open { opacity: 1; }
  .modal-overlay[hidden] { display: none; }
  .modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; width: 100%; max-width: 640px; box-shadow: var(--shadow-modal); transform: translateY(8px) scale(0.98); transition: transform .15s ease; }
  .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; gap: 12px; }
  .modal-id { font-size: 12px; color: var(--ink-faint); font-weight: 700; }
  .modal-title-input { font-size: 18px; font-weight: 700; margin: 4px 0 0; width: 100%; border: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px; }
  .modal-title-input:hover, .modal-title-input:focus { background: var(--surface-sunken); }
  .modal-close { border: none; background: var(--surface-sunken); color: var(--ink-dim); width: 30px; height: 30px; border-radius: 8px; font-size: 15px; flex-shrink: 0; }
  .modal-close:hover { color: var(--ink); }
  .modal-meta-static { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 20px; padding: 14px 24px 0; }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-item-wide { grid-column: 1 / -1; }
  .meta-label { font-size: 11px; font-weight: 700; letter-spacing: 0; color: var(--ink-faint); }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .modal-body { padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-section-label { font-size: 11px; font-weight: 700; letter-spacing: 0; color: var(--ink-faint); margin-bottom: 8px; display: block; }
  .modal-title-input, .content-input, .comment-form textarea { background: var(--surface-sunken); }
  .content-input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; resize: vertical; min-height: 220px; }
  .refs-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .refs-list span { font-size: 12px; background: var(--surface-sunken); border-radius: 6px; padding: 4px 8px; }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .comment-name { font-size: 13px; font-weight: 700; }
  .comment-time { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
  .comment-text { font-size: 13px; color: var(--ink-dim); margin-top: 2px; line-height: 1.5; white-space: pre-wrap; }
  .no-comment { font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; min-height: 40px; resize: vertical; }
  .comment-form button { border: none; background: var(--accent); color: #071013; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 700; align-self: flex-start; }
  .claim-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .claim-form input { min-width: 0; height: 36px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-sunken); padding: 0 10px; }
  .modal-footer { display: flex; justify-content: space-between; padding: 0 24px 22px; }
  .danger-btn { border: 1px solid var(--crit-soft); background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; }
  .danger-btn:hover { background: var(--crit); color: #fff; }

  /* ── roadmap ── */
  .roadmap { padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1100px; }
  .progress-bar { height: 6px; border-radius: 4px; background: var(--surface-sunken); overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .epic-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-card); }
  .epic-head { padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 8px; }
  .epic-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .epic-name { font-size: 16px; font-weight: 700; }
  .epic-frac { font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .epic-def { font-size: 13px; color: var(--ink-dim); line-height: 1.6; max-width: 80ch; }
  .epic-body { padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
  .story-block { border-top: 1px solid var(--line); padding-top: 14px; }
  .story-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .story-name { font-size: 13px; font-weight: 700; }
  .story-frac { font-size: 12px; color: var(--ink-dim); font-weight: 700; flex-shrink: 0; }
  .story-def { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; line-height: 1.5; }
  .story-progress { margin-bottom: 10px; }
  .story-tasks { display: flex; flex-direction: column; gap: 1px; }
  .task-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
  .task-row:hover { background: var(--surface-sunken); }
  .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-id { font-size: 11px; color: var(--ink-faint); flex-shrink: 0; width: 64px; }
  .task-title { flex: 1; }
  .task-title.is-done { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .no-tasks { font-size: 12px; color: var(--ink-faint); padding: 4px 8px; }

  /* ── blueprint workbench ── */
  .blueprint-shell { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: calc(100vh - 67px); }
  .blueprint-main { min-width: 0; padding: 16px; }
  .blueprint-toolbar { min-height: 44px; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .blueprint-toolbar select, .blueprint-create-form input, .blueprint-create-form select {
    height: 36px; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); padding: 0 12px;
  }
  .blueprint-toolbar select { min-width: 220px; }
  .blueprint-mode-switch { display: flex; padding: 2px; background: var(--surface-sunken); border-radius: 6px; }
  .blueprint-mode-switch button { height: 30px; min-width: 52px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-faint); font-size: 12px; font-weight: 600; }
  .blueprint-mode-switch button:hover { color: var(--ink); }
  .blueprint-mode-switch button.is-active { background: var(--surface-raised); color: var(--accent); }
  .blueprint-revision { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .blueprint-create-form { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .blueprint-create-form[hidden] { display: none; }
  .blueprint-stage { position: relative; height: calc(100vh - 151px); min-height: 560px; background: var(--surface-sunken); overflow: hidden; }
  .blueprint-canvas { width: 100%; height: 100%; }
  .blueprint-canvas .excalidraw.theme--dark .excalidraw__canvas { filter: none; }
  .blueprint-canvas[hidden], .blueprint-outline[hidden], .blueprint-empty[hidden] { display: none; }
  .blueprint-outline { height: 100%; padding: 16px; overflow: auto; }
  .blueprint-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .blueprint-node { position: relative; min-height: 136px; border-top: 2px solid var(--accent); border-radius: 6px; background: var(--surface); padding: 16px; text-align: left; color: inherit; }
  .blueprint-node:hover { background: var(--surface-raised); }
  .blueprint-node.is-selected { box-shadow: inset 0 0 0 2px var(--accent); }
  .blueprint-node[data-status="fact"] { border-top-color: var(--good); }
  .blueprint-node[data-status="assumption"], .blueprint-node[data-status="hypothesis"] { border-top-color: var(--warn); }
  .blueprint-node[data-status="decision"] { border-top-color: var(--accent); }
  .blueprint-node.is-archived { opacity: 0.42; }
  .blueprint-node-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .blueprint-node-type { font-size: 11px; font-weight: 700; color: var(--accent); }
  .blueprint-node-status { font-size: 11px; color: var(--ink-faint); }
  .blueprint-node-title { margin-top: 12px; font-size: 16px; line-height: 1.25; }
  .blueprint-node-body { margin-top: 8px; color: var(--ink-dim); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .blueprint-node-meta { margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .blueprint-edges { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .blueprint-edge { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; font-size: 12px; color: var(--ink-dim); }
  .blueprint-edge-relation { color: var(--warn); }
  .blueprint-inspector { border-left: 1px solid var(--line); background: #0d1014; overflow-y: auto; }
  .blueprint-panel { padding: 16px; border-bottom: 1px solid var(--line); }
  .blueprint-panel-title { font-size: 14px; line-height: 1.35; }
  .blueprint-panel-context { margin-top: 4px; color: var(--ink-faint); font-size: 12px; line-height: 1.5; }
  .blueprint-stream-list, .blueprint-discussion-list, .blueprint-proposal-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .blueprint-event { border-left: 2px solid var(--line-strong); padding: 8px; background: var(--surface-sunken); }
  .blueprint-event.is-live { border-left-color: var(--accent); }
  .blueprint-event-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
  .blueprint-event-message { margin-top: 4px; color: var(--ink-dim); font-size: 13px; line-height: 1.55; }
  .blueprint-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-faint); font-size: 13px; }
  .blueprint-discussion { padding: 8px; background: var(--surface-sunken); }
  .blueprint-discussion-author { font-size: 12px; font-weight: 700; color: var(--ink-dim); }
  .blueprint-discussion-text { margin-top: 4px; font-size: 12px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; }
  .blueprint-discussion-form { margin-top: 12px; }
  .blueprint-discussion-form textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-sunken); padding: 8px; font-size: 13px; line-height: 1.5; }
  .blueprint-discussion-form .toolbar-btn { width: 100%; margin-top: 8px; }
  .blueprint-proposal { padding: 12px; background: var(--surface-sunken); }
  .blueprint-proposal-agent { font-size: 12px; font-weight: 700; color: var(--accent); }
  .blueprint-proposal-message { margin-top: 4px; font-size: 13px; line-height: 1.55; color: var(--ink-dim); }
  .blueprint-proposal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .blueprint-proposal-actions button { height: 32px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  .proposal-accept { border: 0; background: var(--good); color: #07130f; }
  .proposal-reject { border: 1px solid var(--line-strong); background: transparent; color: var(--ink-dim); }
  .blueprint-panel-empty { color: var(--ink-faint); font-size: 12px; line-height: 1.5; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 200; }
  #toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.is-error { background: var(--crit); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--surface-sunken); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid var(--surface-sunken); border-radius: 8px; }

  @media (max-width: 1100px) {
    .blueprint-shell { grid-template-columns: minmax(0, 1fr) 288px; }
    .blueprint-toolbar select { min-width: 180px; }
  }

  @media (max-width: 760px) {
    .app-shell { display: block; }
    .sidebar { position: relative; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .sidebar-brand { padding: 12px 16px; }
    .brand-sub { margin-top: 2px; }
    .sidebar-section-head { padding: 8px 12px 4px 16px; }
    .project-nav { flex-direction: row; gap: 8px; overflow-x: auto; padding: 4px 12px 12px; scroll-snap-type: x proximity; }
    .project-nav-item { flex: 0 0 172px; min-height: 48px; scroll-snap-align: start; }
    .project-form { margin: 0 12px 12px; }
    .sidebar-footer { padding: 8px 12px; }
    .project-status { margin: 0; }
    .topbar-row1 { min-height: 64px; padding: 8px 12px; align-items: flex-start; flex-direction: column; }
    .view-tabs { width: 100%; }
    .view-tabs button { flex: 1; min-height: 40px; }
    .lanes { gap: 12px; padding: 12px; }
    .lane { flex-basis: min(86vw, 320px); min-height: calc(100vh - 292px); }
    .lane-add-btn { min-height: 44px; }
    .blueprint-shell { grid-template-columns: 1fr; }
    .blueprint-main { padding: 12px; }
    .blueprint-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 44px auto; }
    .blueprint-toolbar select { min-width: 0; width: 100%; }
    .blueprint-toolbar .icon-btn { width: 44px; height: 44px; }
    .blueprint-mode-switch { grid-column: 1 / 3; }
    .blueprint-mode-switch button { min-height: 40px; flex: 1; }
    #blueprint-materialize { grid-column: 3; grid-row: 2; min-height: 44px; }
    .blueprint-revision { grid-column: 3; grid-row: 1; align-self: center; }
    .blueprint-create-form { flex-wrap: wrap; }
    .blueprint-create-form input, .blueprint-create-form select { flex: 1 1 140px; min-height: 44px; }
    .blueprint-create-form .toolbar-btn { min-height: 44px; }
    .blueprint-stage { height: 60vh; min-height: 440px; }
    .blueprint-inspector { border-left: none; border-top: 1px solid var(--line); }
    .blueprint-panel { padding: 16px; }
    .blueprint-discussion-form .toolbar-btn { min-height: 44px; }
    .modal-overlay { padding: 12px; }
    .modal-head { padding: 16px 16px 0; }
    .modal-meta-static { padding: 12px 16px 0; }
    .modal-body { padding: 16px; }
    .modal-footer { padding: 0 16px 16px; }
    .comment-form { flex-direction: column; }
    .comment-form textarea, .comment-form button { width: 100%; min-height: 44px; }
  }
</style>
<script type="module" src="/kanban-assets/app/blueprint-canvas.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" aria-label="專案導航">
    <div class="sidebar-brand">
      <span class="brand-name">Monstrare</span>
      <span class="brand-sub">專案、決策與執行</span>
    </div>
    <div class="sidebar-section-head">
      <span class="sidebar-label">專案</span>
      <button type="button" class="toolbar-btn icon-btn" id="project-add-toggle" title="新增專案" aria-label="新增專案">＋</button>
    </div>
    <nav class="project-nav" id="project-nav"></nav>
    <div class="project-form" id="project-form" hidden>
      <input id="project-name" placeholder="專案名稱" autocomplete="off">
      <input id="project-id" placeholder="project-id" class="mono" autocomplete="off">
      <input id="project-prefix" placeholder="PREFIX" class="mono prefix-input" maxlength="12" autocomplete="off">
      <div class="project-form-actions">
        <button type="button" class="toolbar-btn primary" id="project-create">建立</button>
        <button type="button" class="toolbar-btn" id="project-cancel">取消</button>
      </div>
    </div>
    <div class="sidebar-footer">
      <span class="project-status" id="project-status"></span>
      <div class="auth-control" id="auth-control" hidden>
        <input type="password" id="token-input" placeholder="Bearer token" autocomplete="off">
        <button type="button" class="toolbar-btn" id="token-apply">套用</button>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <div class="topbar">
      <div class="topbar-row1">
        <div class="active-context">
          <div class="active-project-name" id="active-project-name">全部專案</div>
          <div class="active-project-meta" id="active-project-meta">跨專案總覽</div>
        </div>
        <div class="view-tabs" role="tablist">
          <button type="button" class="is-active" data-view="board" role="tab">看板</button>
          <button type="button" data-view="blueprint" role="tab">藍圖</button>
          <button type="button" data-view="roadmap" role="tab">路線圖</button>
        </div>
      </div>
    </div>

    <main>
      <section id="view-board" class="view is-active">
        <div class="lanes" id="lanes"></div>
      </section>
      <section id="view-blueprint" class="view">
        <div class="blueprint-shell">
          <div class="blueprint-main">
            <div class="blueprint-toolbar">
              <select id="blueprint-select" aria-label="目前藍圖"></select>
              <button type="button" class="toolbar-btn icon-btn" id="blueprint-add-toggle" title="新增藍圖" aria-label="新增藍圖">＋</button>
              <div class="blueprint-mode-switch" role="tablist" aria-label="藍圖顯示方式">
                <button type="button" class="is-active" data-blueprint-mode="canvas" role="tab">畫布</button>
                <button type="button" data-blueprint-mode="outline" role="tab">大綱</button>
              </div>
              <button type="button" class="toolbar-btn" id="blueprint-materialize" disabled>轉成任務卡</button>
              <span class="blueprint-revision" id="blueprint-revision">版本 0</span>
            </div>
            <div class="blueprint-create-form" id="blueprint-create-form" hidden>
              <input id="blueprint-title" placeholder="藍圖名稱" autocomplete="off">
              <input id="blueprint-id" placeholder="blueprint-id" class="mono" autocomplete="off">
              <select id="blueprint-template">
                <option value="startup-pitch">新創提案</option>
                <option value="architecture">系統架構</option>
                <option value="freeform">自由畫布</option>
              </select>
              <button type="button" class="toolbar-btn primary" id="blueprint-create">建立</button>
              <button type="button" class="toolbar-btn" id="blueprint-cancel">取消</button>
            </div>
            <div class="blueprint-stage" id="blueprint-stage">
              <div class="blueprint-canvas" id="blueprint-canvas-root"></div>
              <div class="blueprint-outline" id="blueprint-outline" hidden></div>
              <div class="blueprint-empty" id="blueprint-empty">請先選擇專案</div>
            </div>
          </div>
          <aside class="blueprint-inspector">
            <section class="blueprint-panel">
              <h2 class="blueprint-panel-title">討論</h2>
              <p class="blueprint-panel-context" id="blueprint-discussion-context">未選取節點</p>
              <div class="blueprint-discussion-list" id="blueprint-discussion-list"></div>
              <div class="blueprint-discussion-form">
                <textarea id="blueprint-discussion-text" placeholder="記下問題或決定"></textarea>
                <button type="button" class="toolbar-btn primary" id="blueprint-discussion-send">送出留言</button>
              </div>
            </section>
            <section class="blueprint-panel">
              <h2 class="blueprint-panel-title">待審提案</h2>
              <div class="blueprint-proposal-list" id="blueprint-proposal-list"></div>
            </section>
            <section class="blueprint-panel">
              <h2 class="blueprint-panel-title">變更紀錄</h2>
              <div class="blueprint-stream-list" id="blueprint-stream-list"></div>
            </section>
          </aside>
        </div>
      </section>
      <section id="view-roadmap" class="view">
        <div class="roadmap" id="roadmap"></div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var COMMENT_AUTHOR = ""; // 開頁時由 /api/config 帶入本機 git user.name
  var AUTH_REQUIRED = false;
  var API_TOKEN = "";
  try { API_TOKEN = sessionStorage.getItem("monstrare-token") || ""; } catch (_) {}

  var STAGES = [
    { id: "backlog",       label: "待辦",   color: "#8994a1" },
    { id: "blocked",       label: "受阻",   color: "#f06870" },
    { id: "ready",         label: "可開始", color: "#45d29a" },
    { id: "implementing",  label: "進行中", color: "#42c7d5" },
    { id: "verify",        label: "驗證",   color: "#e2aa43" },
    { id: "done",          label: "完成",   color: "#57c989" }
  ];
  var WIP_CAPS = { implementing: 3, verify: 5 };

  var TICKETS = [];
  var EPICS = [];
  var PROJECTS = [];
  var ACTIVE_PROJECT = "__all__";
  var BLUEPRINTS = [];
  var ACTIVE_BLUEPRINT = "";
  var BLUEPRINT_DOCUMENT = null;
  var BLUEPRINT_EVENTS = [];
  var BLUEPRINT_DISCUSSIONS = [];
  var BLUEPRINT_PROPOSALS = [];
  var SELECTED_BLUEPRINT_NODE = "";
  var BLUEPRINT_MODE = "canvas";
  var blueprintEventSource = null;
  var openId = null;
  var currentView = "board";

  function stageIndex(id) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return i; return -1; }
  function getTicket(id) { return TICKETS.filter(function (x) { return x.id === id; })[0]; }
  function ticketsByStage(id) {
    return TICKETS.filter(function (x) { return x.stage === id; }).sort(function (a, b) { return a.order - b.order; });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function riskLabel(r) { return { low: "低風險", medium: "中風險", high: "高風險" }[r] || r; }
  function trackLabel(t) { return { frontend: "前端", backend: "後端", integration: "前後端串接", "n/a": "" }[t] || ""; }

  /* ── API ── */
  function api(path, options) {
    var opts = Object.assign({}, options || {});
    opts.headers = Object.assign({}, opts.headers || {});
    if (API_TOKEN) opts.headers.Authorization = "Bearer " + API_TOKEN;
    return fetch(path, opts).then(function (res) {
      if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || res.statusText); });
      return res.json();
    });
  }
  function projectPath(pid, suffix) {
    return "/api/projects/" + encodeURIComponent(pid) + suffix;
  }
  function projectForTicket(tk) {
    return tk.project || (ACTIVE_PROJECT !== "__all__" ? ACTIVE_PROJECT : "");
  }
  function renderProjectControls() {
    var allActive = ACTIVE_PROJECT === "__all__";
    var nav = '<button type="button" class="project-nav-item' + (allActive ? " is-active" : "") + '" data-project-id="__all__">' +
      '<span class="project-mark">總</span><span class="project-nav-copy"><span class="project-nav-name">全部專案</span>' +
      '<span class="project-nav-prefix">跨專案總覽</span></span></button>';
    nav += PROJECTS.map(function (project) {
      var active = project.id === ACTIVE_PROJECT;
      return '<button type="button" class="project-nav-item' + (active ? " is-active" : "") + '" data-project-id="' + escapeHtml(project.id) + '">' +
        '<span class="project-mark">' + escapeHtml(project.prefix.slice(0, 3)) + '</span><span class="project-nav-copy">' +
        '<span class="project-nav-name">' + escapeHtml(project.name) + '</span><span class="project-nav-prefix">' +
        escapeHtml(project.prefix) + '</span></span></button>';
    }).join("");
    document.getElementById("project-nav").innerHTML = nav;

    var active = PROJECTS.filter(function (project) { return project.id === ACTIVE_PROJECT; })[0];
    document.getElementById("active-project-name").textContent = active ? active.name : "全部專案";
    document.getElementById("active-project-meta").textContent = active ? active.prefix + " · " + active.id : "跨專案總覽";
    document.getElementById("project-status").textContent = PROJECTS.length + " 個專案 · " + TICKETS.length + " 張卡片";
    document.getElementById("auth-control").hidden = !AUTH_REQUIRED;
    document.getElementById("token-input").value = API_TOKEN;
  }
  function loadProjectData() {
    var cardsRequest = ACTIVE_PROJECT === "__all__"
      ? api("/api/cards")
      : api(projectPath(ACTIVE_PROJECT, "/cards"));
    var epicsRequest = ACTIVE_PROJECT === "__all__"
      ? Promise.all(PROJECTS.map(function (project) { return api(projectPath(project.id, "/epics")); }))
          .then(function (groups) { return { epics: groups.reduce(function (all, group) { return all.concat(group.epics || []); }, []) }; })
      : api(projectPath(ACTIVE_PROJECT, "/epics"));
    var blueprintsRequest = ACTIVE_PROJECT === "__all__"
      ? Promise.resolve([])
      : api(projectPath(ACTIVE_PROJECT, "/blueprints"));
    return Promise.all([cardsRequest, epicsRequest, blueprintsRequest]).then(function (values) {
      TICKETS = values[0];
      EPICS = values[1].epics || [];
      BLUEPRINTS = values[2];
      if (!BLUEPRINTS.some(function (item) { return item.id === ACTIVE_BLUEPRINT; })) {
        ACTIVE_BLUEPRINT = BLUEPRINTS.length ? BLUEPRINTS[0].id : "";
      }
      return loadActiveBlueprint();
    });
  }
  function closeBlueprintStream() {
    if (blueprintEventSource) blueprintEventSource.close();
    blueprintEventSource = null;
  }
  function loadActiveBlueprint() {
    closeBlueprintStream();
    BLUEPRINT_EVENTS = [];
    BLUEPRINT_DISCUSSIONS = [];
    BLUEPRINT_PROPOSALS = [];
    SELECTED_BLUEPRINT_NODE = "";
    if (ACTIVE_PROJECT === "__all__" || !ACTIVE_BLUEPRINT) {
      BLUEPRINT_DOCUMENT = null;
      return Promise.resolve();
    }
    var base = "/blueprints/" + encodeURIComponent(ACTIVE_BLUEPRINT);
    return Promise.all([
      api(projectPath(ACTIVE_PROJECT, base)),
      api(projectPath(ACTIVE_PROJECT, base + "/discussions")),
      api(projectPath(ACTIVE_PROJECT, base + "/proposals"))
    ]).then(function (values) {
        BLUEPRINT_DOCUMENT = values[0];
        BLUEPRINT_DISCUSSIONS = values[1];
        BLUEPRINT_PROPOSALS = values[2];
        connectBlueprintStream();
      });
  }
  function connectBlueprintStream() {
    if (!BLUEPRINT_DOCUMENT || typeof EventSource === "undefined") return;
    var url = projectPath(
      ACTIVE_PROJECT,
      "/blueprints/" + encodeURIComponent(ACTIVE_BLUEPRINT) + "/events?after=" + BLUEPRINT_DOCUMENT.revision
    );
    blueprintEventSource = new EventSource(url);
    blueprintEventSource.addEventListener("blueprint-revision", function (event) {
      var revision;
      try { revision = JSON.parse(event.data); } catch (_) { return; }
      BLUEPRINT_EVENTS.unshift(revision);
      BLUEPRINT_EVENTS = BLUEPRINT_EVENTS.slice(0, 30);
      api(projectPath(ACTIVE_PROJECT, "/blueprints/" + encodeURIComponent(ACTIVE_BLUEPRINT)))
        .then(function (document) {
          BLUEPRINT_DOCUMENT = document;
          renderBlueprint();
        })
        .catch(function (err) { showToast("藍圖更新失敗：" + err.message, true); });
    });
  }
  function loadAll() {
    return Promise.all([api("/api/config"), api("/api/projects")]).then(function (values) {
      COMMENT_AUTHOR = values[0].owner || "匿名";
      AUTH_REQUIRED = !!values[0].authRequired;
      PROJECTS = values[1];
      var saved = "";
      try { saved = sessionStorage.getItem("monstrare-project") || ""; } catch (_) {}
      if (saved === "__all__" || PROJECTS.some(function (p) { return p.id === saved; })) ACTIVE_PROJECT = saved;
      else ACTIVE_PROJECT = PROJECTS.length ? PROJECTS[0].id : "__all__";
      renderProjectControls();
      return loadProjectData();
    });
  }
  function saveOne(tk) {
    var pid = projectForTicket(tk);
    return api(projectPath(pid, "/cards/" + encodeURIComponent(tk.id)), {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(tk)
    }).catch(function (err) { showToast("儲存失敗：" + err.message, true); throw err; });
  }
  function saveBulk(list) {
    var groups = {};
    list.forEach(function (tk) {
      var pid = projectForTicket(tk);
      if (!groups[pid]) groups[pid] = [];
      groups[pid].push(tk);
    });
    return Promise.all(Object.keys(groups).map(function (pid) {
      return api(projectPath(pid, "/cards"), {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(groups[pid])
      });
    })).catch(function (err) { showToast("儲存失敗：" + err.message, true); throw err; });
  }
  function createCard(input) {
    if (ACTIVE_PROJECT === "__all__") return Promise.reject(new Error("請先選擇專案"));
    return api(projectPath(ACTIVE_PROJECT, "/cards"), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(input)
    }).catch(function (err) { showToast("新增失敗：" + err.message, true); throw err; });
  }
  function deleteCard(tk) {
    return api(projectPath(projectForTicket(tk), "/cards/" + encodeURIComponent(tk.id)), { method: "DELETE" })
      .catch(function (err) { showToast("刪除失敗：" + err.message, true); throw err; });
  }

  /* ── render: lanes ── */
  function dependsOnBadge(tk) {
    if (!tk.dependsOn || !tk.dependsOn.length) return "";
    var missing = [], unmet = [];
    tk.dependsOn.forEach(function (id) {
      var dep = getTicket(id);
      if (!dep) missing.push(id); else if (dep.stage !== "done") unmet.push(id);
    });
    if (missing.length) return '<span class="pill dep-pill dep-missing">前置卡片不存在</span>';
    if (unmet.length) return '<span class="pill dep-pill dep-blocked">' + unmet.length + ' 張前置卡未完成</span>';
    return '<span class="pill dep-pill dep-ok">前置卡已完成</span>';
  }

  function cardHtml(tk) {
    var badges = '<span class="pill risk-' + tk.risk + '">' + riskLabel(tk.risk) + "</span>";
    if (tk.track && tk.track !== "n/a") badges += '<span class="pill track-pill">' + trackLabel(tk.track) + "</span>";
    if (tk.agent) badges += '<span class="pill agent-pill">' + escapeHtml(tk.agent) + "</span>";
    if (ACTIVE_PROJECT === "__all__" && tk.project) badges += '<span class="pill track-pill">' + escapeHtml(tk.project) + "</span>";
    if (tk.approvalRequired) badges += '<span class="pill approval-pill">需人工核准</span>';
    badges += dependsOnBadge(tk);
    return (
      '<div class="ticket-card risk-stripe-' + tk.risk + '" data-id="' + escapeHtml(tk.id) + '" draggable="true" tabindex="0">' +
      '<div class="ticket-id mono">' + tk.id + "</div>" +
      '<div class="ticket-title">' + escapeHtml(tk.title) + "</div>" +
      '<div class="ticket-badges">' + badges + "</div>" +
      '<div class="ticket-meta-row"><span>' + escapeHtml(tk.owner) + "</span></div>" +
      "</div>"
    );
  }

  function laneHtml(stage) {
    var items = ticketsByStage(stage.id);
    var cap = WIP_CAPS[stage.id];
    var over = cap && items.length > cap;
    var gauge = cap ? items.length + " / " + cap : String(items.length);
    var body = items.length ? items.map(cardHtml).join("") : '<div class="lane-empty">沒有卡片</div>';
    return (
      '<div class="lane" data-stage="' + stage.id + '" style="border-top: 3px solid ' + stage.color + '">' +
      '<div class="lane-head">' +
      '<div class="lane-title-row"><span class="lane-title">' + stage.label + "</span>" +
      '<span class="lane-gauge tabular' + (over ? " is-over" : "") + '">' + gauge + "</span>" +
      "</div></div>" +
      '<div class="lane-body" data-lane-body="' + stage.id + '">' + body +
      (ACTIVE_PROJECT === "__all__" ? "" : '<button type="button" class="lane-add-btn" data-add-to="' + stage.id + '">+ 新增卡片</button>') +
      "</div></div>"
    );
  }

  function renderLanes() {
    document.getElementById("lanes").innerHTML = STAGES.map(laneHtml).join("");
  }

  /* ── render: roadmap ── */
  function pct(done, total) { return total ? Math.round((done / total) * 100) : 0; }

  function taskRowHtml(tk) {
    var stage = STAGES[stageIndex(tk.stage)];
    var done = tk.stage === "done";
    return (
      '<button type="button" class="task-row" data-open="' + escapeHtml(tk.id) + '">' +
      '<span class="task-dot" style="background:' + stage.color + '"></span>' +
      '<span class="task-id mono">' + tk.id + "</span>" +
      '<span class="task-title' + (done ? " is-done" : "") + '">' + escapeHtml(tk.title) + "</span>" +
      (tk.track && tk.track !== "n/a" ? '<span class="pill track-pill">' + trackLabel(tk.track) + "</span>" : "") +
      '<span class="pill risk-' + tk.risk + '">' + riskLabel(tk.risk) + "</span>" +
      "</button>"
    );
  }

  function storyBlockHtml(epicName, story) {
    var epicDef = EPICS.filter(function (e) { return e.name === epicName; })[0];
    var knownStoryNames = epicDef ? epicDef.stories.map(function (s) { return s.name; }) : [];
    var tasks = TICKETS.filter(function (t) {
      if (t.epic !== epicName) return false;
      return story.__orphan ? knownStoryNames.indexOf(t.userStory) === -1 : t.userStory === story.name;
    });
    var doneCount = tasks.filter(function (t) { return t.stage === "done"; }).length;
    var body = tasks.length
      ? '<div class="story-tasks">' + tasks.map(taskRowHtml).join("") + "</div>"
      : '<p class="no-tasks">尚無任務卡。</p>';
    return (
      '<div class="story-block">' +
      '<div class="story-head"><span class="story-name">' + escapeHtml(story.name) + "</span>" +
      '<span class="story-frac tabular">' + doneCount + " / " + tasks.length + " 完成 · " + pct(doneCount, tasks.length) + "%</span></div>" +
      '<p class="story-def">' + escapeHtml(story.definition || "") + "</p>" +
      '<div class="progress-bar story-progress"><span style="width:' + pct(doneCount, tasks.length) + '%"></span></div>' +
      body +
      "</div>"
    );
  }

  function epicCardHtml(epic) {
    var tasks = TICKETS.filter(function (t) { return t.epic === epic.name; });
    var doneCount = tasks.filter(function (t) { return t.stage === "done"; }).length;
    var storyNames = (epic.stories || []).map(function (s) { return s.name; });
    var stories = (epic.stories || []).map(function (s) { return storyBlockHtml(epic.name, s); }).join("");
    var orphans = tasks.filter(function (t) { return storyNames.indexOf(t.userStory) === -1; });
    if (orphans.length) {
      stories += storyBlockHtml(epic.name, { name: "未分類", definition: "尚未指定使用情境。", __orphan: true });
    }
    return (
      '<div class="epic-card">' +
      '<div class="epic-head">' +
      '<div class="epic-title-row"><span class="epic-name">' + escapeHtml(epic.name) + "</span>" +
      '<span class="epic-frac tabular">' + doneCount + " / " + tasks.length + " 完成 · " + pct(doneCount, tasks.length) + "%</span></div>" +
      '<p class="epic-def">' + escapeHtml(epic.definition || "") + "</p>" +
      '<div class="progress-bar"><span style="width:' + pct(doneCount, tasks.length) + '%"></span></div>' +
      "</div>" +
      '<div class="epic-body">' + stories + "</div>" +
      "</div>"
    );
  }

      draft: "草稿", fact: "事實", assumption: "假設", hypothesis: "待驗證", decision: "已決定"

      ? ""

      '<span class="blueprint-node-status">' + escapeHtml(statusLabels[node.status] || node.status) + confidence + '</span></div>' +

      '<div class="blueprint-node-meta">' + escapeHtml(node.id) + ' · ' + escapeHtml(node.updatedBy || node.createdBy || "") + '</div></button>';

  function blueprintActorId() {
    var value = String(COMMENT_AUTHOR || "owner")
      .trim()
      .replace(/[^A-Za-z0-9_-]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 64);
    return /^[A-Za-z0-9]/.test(value) ? value : "owner";
  }

  function activeBlueprintApi(suffix) {
    return projectPath(
      ACTIVE_PROJECT,
      "/blueprints/" + encodeURIComponent(ACTIVE_BLUEPRINT) + (suffix || "")
    );
  }

  function acceptBlueprintDocument(document) {
    BLUEPRINT_DOCUMENT = document;
    var summary = BLUEPRINTS.find(function (item) { return item.id === document.id; });
    if (summary) {
      summary.revision = document.revision;
      summary.updatedAt = document.updatedAt;
      summary.nodeCount = document.nodes.length;
      summary.edgeCount = document.edges.length;
    }
    renderBlueprint();
  }

  function saveBlueprintLayouts(layouts) {
    if (!BLUEPRINT_DOCUMENT || !layouts.length) return;
    var operations = layouts.slice(0, 50).map(function (item) {
      return { type: "patchNode", nodeId: item.nodeId, changes: { layout: item.layout } };
    });
    api(activeBlueprintApi("/operations"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        baseRevision: BLUEPRINT_DOCUMENT.revision,
        actor: { type: "human", id: blueprintActorId() },
        message: "調整節點位置",
        operations: operations
      })
    }).then(function (result) {
      acceptBlueprintDocument(result.document);
    }).catch(function (err) {
      showToast("位置儲存失敗：" + err.message, true);
      loadActiveBlueprint().then(renderBlueprint);

  function persistField(tk) {
    saveOne(tk).then(function () { renderAll(); });
  }

  function showToast(msg, isError) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("is-error", !!isError);
    el.classList.add("is-shown");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("is-shown"); }, 2600);
  }

  /* ── drag and drop ── */
  var dragId = null;

  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll(".ticket-card:not(.is-dragging)"));
    var closest = { offset: -Infinity, element: null };
    els.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }

  function commitDrop() {
    var changed = [];
    document.querySelectorAll(".lane").forEach(function (lane) {
      var stageId = lane.dataset.stage;
      var ids = Array.prototype.map.call(lane.querySelectorAll(".ticket-card"), function (el) { return el.dataset.id; });
      ids.forEach(function (id, i) {
        var tk = getTicket(id);
        if (!tk) return;
        var newOrder = i + 1;
        if (tk.stage !== stageId || tk.order !== newOrder) {
          tk.stage = stageId;
          tk.order = newOrder;
          changed.push(tk);
        }
      });
    });
    if (changed.length) {
      saveBulk(changed).catch(function () { loadAll().then(renderAll); });
    }
  }

  /* ── events ── */
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".ticket-card");
    if (!card) return;
    dragId = card.dataset.id;
    setTimeout(function () { card.classList.add("is-dragging"); }, 0);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest(".ticket-card");
    if (card) card.classList.remove("is-dragging");
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { l.classList.remove("is-drag-over"); });
  });

  document.addEventListener("dragover", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane || !dragId) return;
    e.preventDefault();
    document.querySelectorAll(".lane.is-drag-over").forEach(function (l) { if (l !== lane) l.classList.remove("is-drag-over"); });
    lane.classList.add("is-drag-over");
    var laneBody = lane.querySelector(".lane-body");
    var dragging = laneBody.querySelector(".is-dragging") || document.querySelector('.ticket-card[data-id="' + dragId + '"]');
    if (!dragging) return;
    var afterEl = getDragAfterElement(laneBody, e.clientY);
    var addBtn = laneBody.querySelector(".lane-add-btn");
    if (afterEl == null) laneBody.insertBefore(dragging, addBtn);
    else laneBody.insertBefore(dragging, afterEl);
  });

  document.addEventListener("drop", function (e) {
    var lane = e.target.closest(".lane");
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove("is-drag-over");
    dragId = null;
    commitDrop();
  });

  document.addEventListener("click", function (e) {
    var projectNavItem = e.target.closest("[data-project-id]");
    if (projectNavItem) {
      ACTIVE_PROJECT = projectNavItem.dataset.projectId;
      try { sessionStorage.setItem("monstrare-project", ACTIVE_PROJECT); } catch (_) {}
      loadProjectData().then(renderAll).catch(function (err) { showToast("讀取失敗：" + err.message, true); });
      return;
    }
    if (e.target.id === "project-add-toggle") {
      document.getElementById("project-form").hidden = false;
      document.getElementById("project-name").focus();
      return;
    }
    if (e.target.id === "project-cancel") {
      document.getElementById("project-form").hidden = true;
      return;
    }
    if (e.target.id === "project-create") {
      var name = document.getElementById("project-name").value.trim();
      var id = document.getElementById("project-id").value.trim().toLowerCase();
      var prefix = document.getElementById("project-prefix").value.trim().toUpperCase();
      if (!name || !id || !prefix) { showToast("請填寫名稱、id 與 prefix", true); return; }
      api("/api/projects", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: id, name: name, prefix: prefix })
      }).then(function (project) {
        PROJECTS.push(project);
        ACTIVE_PROJECT = project.id;
        try { sessionStorage.setItem("monstrare-project", ACTIVE_PROJECT); } catch (_) {}
        document.getElementById("project-form").hidden = true;
        return loadProjectData();
      }).then(function () { renderAll(); showToast("專案已建立"); })
        .catch(function (err) { showToast("建立失敗：" + err.message, true); });
      return;
    }
    if (e.target.id === "token-apply") {
      API_TOKEN = document.getElementById("token-input").value.trim();
      try { sessionStorage.setItem("monstrare-token", API_TOKEN); } catch (_) {}
      showToast(API_TOKEN ? "Token 已套用" : "Token 已清除");
      return;
    }
    var blueprintModeButton = e.target.closest("[data-blueprint-mode]");
    if (blueprintModeButton) {
      BLUEPRINT_MODE = blueprintModeButton.dataset.blueprintMode;
      renderBlueprint();
      return;
    }
    var blueprintNodeButton = e.target.closest("[data-blueprint-node-id]");
    if (blueprintNodeButton) {
      SELECTED_BLUEPRINT_NODE = blueprintNodeButton.dataset.blueprintNodeId;
      renderBlueprint();
      return;
    }
    if (e.target.id === "blueprint-discussion-send") {
      var discussionText = document.getElementById("blueprint-discussion-text").value.trim();
      if (!discussionText || !BLUEPRINT_DOCUMENT) return;
      e.target.disabled = true;
      api(activeBlueprintApi("/discussions"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          author: { type: "human", id: blueprintActorId() },
          nodeIds: SELECTED_BLUEPRINT_NODE ? [SELECTED_BLUEPRINT_NODE] : [],
          text: discussionText
        })
      }).then(function (message) {
        BLUEPRINT_DISCUSSIONS.push(message);
        document.getElementById("blueprint-discussion-text").value = "";
        renderBlueprintInspector();
      }).catch(function (err) {
        showToast("留言送出失敗：" + err.message, true);
      }).finally(function () {
        e.target.disabled = false;
      });
      return;
    }
    var proposalButton = e.target.closest("[data-proposal-action]");
    if (proposalButton) {
      proposalButton.disabled = true;
      api(activeBlueprintApi(
        "/proposals/" + encodeURIComponent(proposalButton.dataset.proposalId) +
        "/" + proposalButton.dataset.proposalAction
      ), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ actor: { type: "human", id: blueprintActorId() } })
      }).then(function (result) {
        var index = BLUEPRINT_PROPOSALS.findIndex(function (proposal) {
          return proposal.id === result.proposal.id;
        });
        if (index >= 0) BLUEPRINT_PROPOSALS[index] = result.proposal;
        if (result.document) acceptBlueprintDocument(result.document);
        else renderBlueprintInspector();
        showToast(result.proposal.status === "accepted" ? "提案已套用" : "提案已拒絕");
      }).catch(function (err) {
        proposalButton.disabled = false;
        showToast("提案處理失敗：" + err.message, true);
      });
      return;
    }
    if (e.target.id === "blueprint-materialize") {
      if (!SELECTED_BLUEPRINT_NODE || !BLUEPRINT_DOCUMENT) return;
      e.target.disabled = true;
      api(activeBlueprintApi("/materialize"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nodeIds: [SELECTED_BLUEPRINT_NODE],
          actor: { type: "human", id: blueprintActorId() },
          owner: COMMENT_AUTHOR
        })
      }).then(function (result) {
        TICKETS = TICKETS.concat(result.cards);
        renderProjectControls();
        renderLanes();
        acceptBlueprintDocument(result.document);
        showToast("已建立任務卡 " + result.cards[0].id);
      }).catch(function (err) {
        e.target.disabled = false;
        showToast("任務卡建立失敗：" + err.message, true);
      });
      return;
    }
    if (e.target.id === "blueprint-add-toggle") {
      document.getElementById("blueprint-create-form").hidden = false;
      document.getElementById("blueprint-title").focus();
      return;
    }
    if (e.target.id === "blueprint-cancel") {
      document.getElementById("blueprint-create-form").hidden = true;
      return;
    }
    if (e.target.id === "blueprint-create") {
      var blueprintTitle = document.getElementById("blueprint-title").value.trim();
      var blueprintId = document.getElementById("blueprint-id").value.trim().toLowerCase();
      var blueprintTemplate = document.getElementById("blueprint-template").value;
      if (!blueprintTitle || !blueprintId) { showToast("請填寫藍圖名稱與 id", true); return; }
      api(projectPath(ACTIVE_PROJECT, "/blueprints"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: blueprintId, title: blueprintTitle, template: blueprintTemplate })
      }).then(function (blueprintDoc) {
        BLUEPRINTS.push({
          id: blueprintDoc.id,
          project: blueprintDoc.project,
          title: blueprintDoc.title,
          template: blueprintDoc.template,
          revision: blueprintDoc.revision,
          updatedAt: blueprintDoc.updatedAt,
          nodeCount: 0,
          edgeCount: 0
        });
        ACTIVE_BLUEPRINT = blueprintDoc.id;
        BLUEPRINT_DOCUMENT = blueprintDoc;
        BLUEPRINT_EVENTS = [];
        document.getElementById("blueprint-create-form").hidden = true;
        connectBlueprintStream();
        renderBlueprint();
        showToast("藍圖已建立");
      }).catch(function (err) { showToast("建立失敗：" + err.message, true); });
      return;
    }
    if (e.target.closest(".ticket-card")) { openModal(e.target.closest(".ticket-card").dataset.id); return; }

    var taskRow = e.target.closest(".task-row[data-open]");
    if (taskRow) { openModal(taskRow.dataset.open); return; }

    var viewTab = e.target.closest(".view-tabs button");
    if (viewTab) { switchView(viewTab.dataset.view); return; }

    var addBtn = e.target.closest("[data-add-to]");
    if (addBtn) {
      var stageId = addBtn.dataset.addTo;
      var form = document.createElement("div");
      form.className = "lane-add-form";
      form.innerHTML = '<input type="text" placeholder="卡片標題…" autofocus><div class="row">' +
        '<button type="button" class="save">新增</button><button type="button" class="cancel">取消</button></div>';
      addBtn.replaceWith(form);
      var input = form.querySelector("input");
      input.focus();
      function submit() {
        var title = input.value.trim();
        if (!title) return;
        createCard({ title: title, stage: stageId }).then(function (card) {
          TICKETS.push(card);
          renderAll();
        });
      }
      form.querySelector(".save").addEventListener("click", submit);
      form.querySelector(".cancel").addEventListener("click", renderAll);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); if (e.key === "Escape") renderAll(); });
      return;
    }

    if (e.target === document.getElementById("modal-overlay")) { closeModal(); return; }
    if (e.target.id === "modal-close-btn") { closeModal(); return; }

    if (e.target.id === "add-comment" && openId) {
      var tk4 = getTicket(openId);
      var textarea = document.getElementById("new-comment");
      var text = textarea.value.trim();
      if (!text) return;
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var time = pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
      tk4.comments.push({ name: COMMENT_AUTHOR, time: time, text: text });
      saveOne(tk4).then(function () { openModal(openId); });
      return;
    }

    if (e.target.id === "claim-card" && openId) {
      var claimInput = document.getElementById("claim-agent");
      var agentName = claimInput.value.trim();
      if (!agentName) return;
      var claimTicket = getTicket(openId);
      e.target.disabled = true;
      api(projectPath(projectForTicket(claimTicket), "/cards/" + encodeURIComponent(openId) + "/claim"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent: agentName })
      }).then(function (card) {
        var ticketIndex = TICKETS.findIndex(function (item) { return item.id === card.id; });
        if (ticketIndex >= 0) TICKETS[ticketIndex] = card;
        openModal(card.id);
        renderLanes();
        showToast(card.id + " 已由 " + card.agent + " 認領");
      }).catch(function (err) {
        e.target.disabled = false;
        showToast("認領失敗：" + err.message, true);
      });
      return;
    }

    if (e.target.id === "delete-card" && openId) {
      if (!window.confirm("確定要刪除 " + openId + " 嗎？此動作無法復原。")) return;
      var idToDelete = openId;
      var ticketToDelete = getTicket(idToDelete);
      deleteCard(ticketToDelete).then(function () {
        TICKETS = TICKETS.filter(function (x) { return x.id !== idToDelete; });
        closeModal();
        renderAll();
      });
      return;
    }
  });

  document.addEventListener("blur", function (e) {
    if (!openId) return;
    var tk = getTicket(openId);
    if (e.target.id === "field-title" && e.target.value.trim() && e.target.value !== tk.title) {
      tk.title = e.target.value.trim(); persistField(tk);
    } else if (e.target.id === "field-content" && e.target.value !== tk.content) {
      tk.content = e.target.value; persistField(tk);
    }
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("modal-overlay").hidden) closeModal();
    if (e.key === "Enter" && e.target.id === "token-input") document.getElementById("token-apply").click();
  });

  document.getElementById("blueprint-select").addEventListener("change", function (e) {
    ACTIVE_BLUEPRINT = e.target.value;
    loadActiveBlueprint().then(renderBlueprint)
      .catch(function (err) { showToast("藍圖讀取失敗：" + err.message, true); });
  });

  window.addEventListener("monstrare:blueprint-node-select", function (event) {
    var nodeId = event.detail || "";
    if (!nodeId && BLUEPRINT_MODE === "outline") return;
    if (nodeId === SELECTED_BLUEPRINT_NODE) return;
    SELECTED_BLUEPRINT_NODE = nodeId;
    renderBlueprint();
  });

  window.addEventListener("monstrare:blueprint-layout", function (event) {
    saveBlueprintLayouts(Array.isArray(event.detail) ? event.detail : []);
  });

  window.addEventListener("beforeunload", closeBlueprintStream);

  loadAll().then(renderAll).catch(function (err) { showToast("讀取失敗：" + err.message, true); });
})();
</script>
</body>
</html>
